[package]
name = "montana-node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "montana_node"
path = "src/lib.rs"

[[bin]]
name = "montana-node"
path = "src/main.rs"

[dependencies]
mt-codec = { workspace = true }
sha2 = { workspace = true }
mt-genesis = { workspace = true }
mt-seed = { workspace = true }
mt-derive = { workspace = true }
mt-pulse = { workspace = true }
mt-proof = { workspace = true }
montana-wallet = { workspace = true }
mt-state = { workspace = true }
mt-store = { workspace = true }
mt-net = { workspace = true }
mt-wire = { workspace = true }
mt-suite = { workspace = true }
zeroize = { workspace = true }

[features]
# A test of a close without a proposal holds back the proposal a machine proves of its own
# (`pulse::withhold`). No build of the protocol enables it.
withhold = []

[dev-dependencies]
mt-conformance = { path = "../mt-conformance" }
# The vectors of a crash fail the file operations of the store at the count they arm.
mt-store = { workspace = true, features = ["fault"] }
# The vectors of a close without a proposal hold back the machine's own (`pulse::withhold`).
montana-node = { path = ".", features = ["withhold"] }

# The harnesses of the model checker stand under cfg(kani), which `cargo kani` sets and no build does.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
