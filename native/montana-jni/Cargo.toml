[package]
name = "montana-jni"
version = "0.1.0"
edition = "2021"
publish = false
description = "Android library: the Montana core (mt-bindings, unchanged) plus the few JNI doors the iOS client reaches through the C ABI."

[lib]
name = "montana"               # System.loadLibrary("montana"): the core plus our JNI doors, one library
crate-type = ["cdylib"]

[dependencies]
mt-bindings = { path = "../../../Montana Protocol/Code/crates/mt-bindings" }
jni = { version = "0.21", default-features = false }
# The core's Android file (mt-bindings/src/ffi_jni.rs) still names mt_mnemonic::entropy_to_mnemonic,
# which the core has since moved behind the test feature `vectors` (the root is drawn by the core,
# never handed in by an app). The feature is enabled only so that file compiles; Kotlin never
# declares nativeEntropyToMnemonic — a person is born by nativeGenerateMnemonic alone, as on iOS.
mt-mnemonic = { path = "../../../Montana Protocol/Code/crates/mt-mnemonic", features = ["vectors"] }

[profile.release]
# the core workspace's own release profile
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true
